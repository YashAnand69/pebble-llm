name: Verify PebbleLM source
on: [push, pull_request]
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run inspect
      - run: npm run prepare:data
      - run: git diff --exit-code -- data/
